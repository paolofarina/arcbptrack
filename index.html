<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101316" />
  <title>ARC BP Track</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">ARC Raiders</p>
      <h1>Blueprint Track</h1>
      <p class="subtitle">Fast blueprint browser built for mobile.</p>
    </div>
    <div class="count-pill"><strong id="visibleCount">0</strong><span>shown</span></div>
  </header>

  <main>
    <section class="controls" aria-label="Blueprint filters">
      <label class="search-box">
        <span class="sr-only">Search blueprints</span>
        <input id="searchInput" type="search" placeholder="Search blueprint…" autocomplete="off" />
      </label>

      <div>
        <p class="filter-label">Type</p>
        <div id="typeFilters" class="chip-row"></div>
      </div>

      <div>
        <p class="filter-label">Rarity</p>
        <div id="rarityFilters" class="chip-row"></div>
      </div>

      <div class="toolbar">
        <button id="clearFilters" class="text-button" type="button">Clear filters</button>
        <select id="sortSelect" aria-label="Sort blueprints">
          <option value="name">Name A–Z</option>
          <option value="rarity">Rarity</option>
          <option value="type">Type</option>
        </select>
      </div>
    </section>

    <section id="grid" class="blueprint-grid" aria-live="polite"></section>

    <div id="emptyState" class="empty-state" hidden>
      No blueprint matches these filters.
    </div>
  </main>

  <dialog id="detailDialog" class="detail-dialog">
    <article>
      <button id="closeDialog" class="close-button" type="button" aria-label="Close">×</button>
      <div id="detailHero" class="detail-hero"></div>
      <div id="detailContent"></div>
    </article>
  </dialog>

  <footer>
    <span>Data cached locally.</span>
    <a href="https://metaforge.app/arc-raiders" rel="noopener noreferrer">MetaForge attribution</a>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
