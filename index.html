<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101316" />
  <title>ARC BP Track</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">ARC Raiders</p>
      <h1>Blueprint Track</h1>
      <p class="subtitle">Trova il blueprint, filtra, apri i dettagli.</p>
    </div>
  </header>

  <main class="app-layout">
    <aside class="filters-panel" aria-label="Filtri blueprint">
      <label class="search-box">
        <span class="filter-label">Cerca</span>
        <input id="searchInput" type="search" placeholder="Nome blueprint…" autocomplete="off" />
      </label>

      <section class="filter-group">
        <p class="filter-label">Tipo</p>
        <div id="typeFilters" class="chip-stack"></div>
      </section>

      <section class="filter-group">
        <p class="filter-label">Rarità</p>
        <div id="rarityFilters" class="chip-stack"></div>
      </section>

      <button id="clearFilters" class="clear-button" type="button">Azzera filtri</button>
    </aside>

    <section class="catalog-panel">
      <div class="catalog-toolbar">
        <div>
          <p class="eyebrow">Catalogo</p>
          <div class="catalog-count"><strong id="visibleCount">0</strong> blueprint mostrati</div>
        </div>

        <select id="sortSelect" aria-label="Ordina blueprint">
          <option value="name">Nome A–Z</option>
          <option value="rarity">Rarità</option>
          <option value="type">Tipo</option>
        </select>
      </div>

      <section id="grid" class="blueprint-grid" aria-live="polite"></section>

      <div id="emptyState" class="empty-state" hidden>
        Nessun blueprint corrisponde ai filtri selezionati.
      </div>
    </section>
  </main>

  <dialog id="detailDialog" class="detail-dialog">
    <article>
      <button id="closeDialog" class="close-button" type="button" aria-label="Chiudi">×</button>
      <div id="detailHero" class="detail-hero"></div>
      <div id="detailContent"></div>
    </article>
  </dialog>

  <footer>
    <span>Dati serviti localmente dal repository.</span>
    <a href="https://metaforge.app/arc-raiders" rel="noopener noreferrer">MetaForge attribution</a>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
