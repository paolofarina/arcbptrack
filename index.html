<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101316" />
  <title>ARC BP Track</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-layout">
      <div class="brand-block">
        <p class="eyebrow">ARC Raiders</p>
        <h1>Blueprint Track</h1>
        <p class="subtitle">Oggetti, blueprint e dati di ritrovamento.</p>
      </div>

      <section class="filters-panel" aria-label="Filtri catalogo">
        <div class="filter-group filter-type">
          <p class="filter-label">Tipo</p>
          <div id="typeFilters" class="chip-wrap"></div>
        </div>

        <div class="filter-group">
          <p class="filter-label">Rarità</p>
          <div id="rarityFilters" class="chip-wrap"></div>
        </div>

        <div class="filter-group">
          <p class="filter-label">Blueprint</p>
          <div id="blueprintFilters" class="chip-wrap"></div>
        </div>
      </section>
    </div>
  </header>

  <main class="catalog-shell">
    <section class="catalog-toolbar">
      <label class="search-box">
        <span class="sr-only">Cerca oggetto</span>
        <input id="searchInput" type="search" placeholder="Cerca oggetto…" autocomplete="off" />
      </label>

      <div class="catalog-count"><strong id="visibleCount">0</strong> oggetti mostrati</div>

      <select id="sortSelect" aria-label="Ordina oggetti">
        <option value="name">Nome A–Z</option>
        <option value="rarity">Rarità</option>
        <option value="type">Tipo</option>
      </select>

      <button id="clearFilters" class="clear-button" type="button">Azzera filtri</button>
    </section>

    <section id="grid" class="blueprint-grid" aria-live="polite"></section>

    <div id="emptyState" class="empty-state" hidden>
      Nessun oggetto corrisponde ai filtri selezionati.
    </div>
  </main>

  <dialog id="detailDialog" class="detail-dialog">
    <article>
      <button id="closeDialog" class="close-button" type="button" aria-label="Chiudi">×</button>
      <div id="detailHero" class="detail-hero"></div>
      <div id="detailContent"></div>
    </article>
  </dialog>

  <footer>
    <span>Dati cache locali nel repository.</span>
    <a href="https://metaforge.app/arc-raiders" rel="noopener noreferrer">MetaForge attribution</a>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
