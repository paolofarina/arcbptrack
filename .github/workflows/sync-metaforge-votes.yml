name: Sync MetaForge location votes

on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 0"
  push:
    paths:
      - "scripts/sync-metaforge-votes.mjs"
      - ".github/workflows/sync-metaforge-votes.yml"

permissions:
  contents: write

concurrency:
  group: sync-metaforge-location-votes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh MetaForge player-voted locations
        run: node scripts/sync-metaforge-votes.mjs

      - name: Commit changed vote cache
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/metaforge-location-votes.json)" ]; then
            echo "No vote changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/metaforge-location-votes.json
          git commit -m "chore(data): refresh MetaForge location votes"
          git pull --rebase origin main
          git push
