name: Probe weekly trials API

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-weekly-trials-api.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe MetaForge weekly trials endpoint
        run: |
          set -euxo pipefail
          curl -sS -D /tmp/headers.txt -o /tmp/body.txt "https://metaforge.app/api/arc-raiders/weekly-trials"
          echo "--- HEADERS ---"
          cat /tmp/headers.txt
          echo "--- BODY ---"
          head -c 20000 /tmp/body.txt
          echo
